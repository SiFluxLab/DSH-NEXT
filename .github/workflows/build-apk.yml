# Builds DSH NEXT APKs on GitHub's own runners.
#
# One run produces, per ABI: the bundled Linux runtime (Ubuntu base + Node +
# patched DSH engine, see runtime/build-runtime.sh), then the APK that carries
# it. Run it from the Actions tab; a `v*` tag runs it too and attaches the APKs
# to a release.
#
# Signing is optional: with the ANDROID_* secrets set the release APK is signed
# with that key, without them Gradle falls back to the debug key (fine for
# trying a build, never for distribution).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: Which ABIs to build
        type: choice
        options: [arm64, x64, both]
        default: arm64
      build_name:
        description: Version name (empty = app/pubspec.yaml)
        type: string
        default: ''
      build_number:
        description: versionCode (empty = build minute)
        type: string
        default: ''
      release:
        description: Attach the APKs to a GitHub release
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  TZ: Asia/Shanghai

jobs:
  abis:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          # flavor = Gradle's, abi = the runtime's own name for it.
          arm64='{"flavor":"arm64","abi":"arm64-v8a"}'
          x64='{"flavor":"x64","abi":"x86_64"}'
          case "${{ inputs.abis || 'both' }}" in
            arm64) list="[$arm64]" ;;
            x64) list="[$x64]" ;;
            *) list="[$arm64,$x64]" ;;
          esac
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"

  runtime:
    needs: abis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.abis.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The hash covers every tracked file under runtime/ (build script, patches,
      # locks, bridge, the 应龙 payload). Anything else — app code, docs — does not
      # need a new runtime, and the built one is reused instead (~2-4 min saved).
      - id: inhash
        shell: bash
        run: echo "hash=$(git ls-tree -r HEAD -- runtime | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the built runtime
        id: out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out/${{ matrix.abi }}
          key: runtime-out-${{ matrix.abi }}-${{ steps.inhash.outputs.hash }}
      - name: Restore the download cache
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-cache-${{ matrix.abi }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/patches/pins.json') }}
      - name: Build the runtime (${{ matrix.abi }})
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils zstd curl
          runtime/build-runtime.sh "${{ matrix.abi }}"
      # actions/cache is evicted after a few quiet days; the release asset keeps a
      # built runtime for as long as the hash is current.
      - name: Store the runtime as a release asset
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="runtime-${{ matrix.abi }}-${{ steps.inhash.outputs.hash }}.tar.xz"
          tar -C "runtime/out/${{ matrix.abi }}" -cJf "$RUNNER_TEMP/$asset" .
          # Both ABIs can reach this at once; a lost race on create is fine.
          gh release view runtime-cache >/dev/null 2>&1 ||
            gh release create runtime-cache --title "Runtime cache" --prerelease \
              --notes "Built runtimes for CI. Safe to delete only if no build needs its hash." || true
          for attempt in 1 2 3; do
            gh release upload runtime-cache "$RUNNER_TEMP/$asset" --clobber && break || sleep 5
          done

      - name: Upload the runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.abi }}
          path: runtime/out/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: [abis, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.abis.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same key as the runtime job: on a warm run this restores the 150 MB runtime
      # straight from the cache instead of downloading it as an artifact.
      - id: inhash
        shell: bash
        run: echo "hash=$(git ls-tree -r HEAD -- runtime | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the built runtime
        id: runtime_out
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out/${{ matrix.abi }}
          key: runtime-out-${{ matrix.abi }}-${{ steps.inhash.outputs.hash }}
      - name: Fetch the runtime from its release asset
        id: release_runtime
        if: steps.runtime_out.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="runtime-${{ matrix.abi }}-${{ steps.inhash.outputs.hash }}.tar.xz"
          if gh release download runtime-cache --pattern "$asset" --dir "$RUNNER_TEMP" 2>/dev/null; then
            mkdir -p "runtime/out/${{ matrix.abi }}"
            tar -C "runtime/out/${{ matrix.abi }}" -xJf "$RUNNER_TEMP/$asset"
            echo "got=true" >> "$GITHUB_OUTPUT"
            echo "restored $asset from the runtime-cache release"
          else
            echo "got=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Place the runtime where Gradle looks for it
        if: steps.runtime_out.outputs.cache-hit != 'true' && steps.release_runtime.outputs.got != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.abi }}
          path: runtime/out/${{ matrix.abi }}

      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'

      - name: Accept the SDK licences
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null || true

      # runtime/tawcroot/build.py pins NDK 28.2.13676358 for libtawcroot.so.
      - name: NDK for libtawcroot
        shell: bash
        run: |
          sdkmanager "ndk;28.2.13676358"
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          cat "$ndk/source.properties" | grep -i revision
          # Runners preinstall an NDK and export ANDROID_NDK_HOME for it;
          # runtime/tawcroot/build.py needs the pinned one.
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Signing key (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No ANDROID_KEYSTORE_BASE64: the APK will be debug-signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dsh-next.jks"
          cat > "$GITHUB_WORKSPACE/app/android/key.properties" <<EOF
          storeFile=$RUNNER_TEMP/dsh-next.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # The runner image is ~14 GB free at start; the NDK and a Flutter build
      # eat a good part of it. Drop what this build never uses.
      - name: Free disk
        shell: bash
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/ndk/2[0-7]* \
                      /usr/local/lib/android/sdk/ndk/29* || true
          df -h / | tail -1

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: Build (${{ matrix.flavor }})
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true
        run: |
          set -o pipefail
          args=(-f "${{ matrix.flavor }}" --no-companion)
          [[ -n "${{ inputs.build_name }}" ]] && args+=(--build-name "${{ inputs.build_name }}")
          [[ -n "${{ inputs.build_number }}" ]] && args+=(--build-number "${{ inputs.build_number }}")
          # Dependency resolution fails now and then on a mirror timeout; one retry
          # costs a minute, a failed run costs the whole matrix.
          for attempt in 1 2; do
            if tooling/build-apk.sh "${args[@]}" 2>&1 | tee build.log; then exit 0; fi
            echo "attempt $attempt failed; retrying in 20 s" >&2
            sleep 20
          done
          exit 1

      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          free -h || true
          df -h / | tail -1 || true
          sudo dmesg 2>/dev/null | tail -20 || true
          [[ -f build.log ]] && tail -80 build.log || true

      - name: Rename the APK
        shell: bash
        run: |
          cd app/build/app/outputs/flutter-apk
          for f in app-*.apk; do
            [[ -e "$f" ]] || continue
            mv "$f" "dsh-next-${{ matrix.flavor }}-${f}"
          done
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.flavor }}
          path: app/build/app/outputs/flutter-apk/dsh-next-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: DSH NEXT ${{ github.ref_name }}
          draft: true
          files: dist/*.apk
