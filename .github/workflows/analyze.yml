# 快速静态检查：push 就验，约 2 分钟，不占 runtime 构建的名额。
#
# 之前所有编译错误都要等到整包构建（11 分钟）才暴露；runtime 一旦失败，
# apk 任务会被跳过，连 analyze 都跑不到。这条流水线只做一件事：flutter analyze。
name: Analyze

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/analyze.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Cache pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml', 'app/pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - name: Format check
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib
        continue-on-error: true
